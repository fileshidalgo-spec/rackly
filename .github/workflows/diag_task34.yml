name: Diag Task 34 — roles reales + RPC rq_editar_rq (solo lectura + no-op)

on:
  workflow_dispatch:
  push:
    branches:
      - diag/task34-guardar

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Diagnóstico BD (roles, RQ 0000192533, no-op de rq_editar_rq)
        env:
          SB_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SB_SERVICE: ${{ secrets.NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cat > diag.mjs << 'EOF'
          const url = process.env.SB_URL.replace(/\/$/, '')
          const H = {
            apikey: process.env.SB_SERVICE,
            Authorization: `Bearer ${process.env.SB_SERVICE}`,
            'Content-Type': 'application/json',
          }
          const p = (t, v) => console.log(`\n=== ${t} ===\n` + JSON.stringify(v, null, 1))
          const get = async (path) => {
            const r = await fetch(`${url}/rest/v1/${path}`, { headers: H })
            if (!r.ok) return { ERROR: `${r.status} ${await r.text()}` }
            return r.json()
          }

          // 1) Roles REALES de todos los usuarios (service_role bypasea RLS)
          const roles = await get('user_roles?select=user_id,role&order=user_id')
          p('user_roles (valores reales)', roles)
          if (!roles.ERROR) p('VALORES DISTINTOS de role', [...new Set(roles.map(r => r.role))])

          // 2) Perfiles (quién es quién)
          p('profiles', await get('profiles?select=id,nombre,correo,aprobado&order=nombre'))

          // 3) La RQ del reporte
          const rqs = await get('rq_atenciones?select=*&numero_rq=eq.0000192533')
          p('rq_atenciones 0000192533', rqs)
          const rq = Array.isArray(rqs) ? rqs[0] : undefined
          if (rq) {
            p('items de la RQ', await get(`rq_atencion_items?select=*&rq_id=eq.${rq.id}&order=orden`))

            // 4) ¿Existe la RPC y responde? Prueba NO-OP (cambios=0, no escribe)
            const enc = {
              numero_rq: rq.numero_rq ?? '', orden_produccion: rq.orden_produccion ?? '',
              producto_codigo: rq.producto_codigo ?? '', producto_descripcion: rq.producto_descripcion ?? '',
              linea: rq.linea ?? '', solicitante: rq.solicitante ?? '',
              notas: rq.notas ?? '', fecha: rq.fecha ?? '', turno: rq.turno ?? '',
            }
            const r = await fetch(`${url}/rest/v1/rpc/rq_editar_rq`, {
              method: 'POST', headers: H,
              body: JSON.stringify({
                p_rq_id: rq.id, p_encabezado: enc, p_items: [],
                p_usuario_id: null, p_usuario_nombre: 'diag-task34', p_usuario_correo: '',
              }),
            })
            p('RPC rq_editar_rq NO-OP (service_role)',
              r.ok ? await r.json() : { ERROR: `${r.status} ${await r.text()}` })
          }
          EOF
          node diag.mjs 2>&1
